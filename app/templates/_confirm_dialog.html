<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title">Delete diagram?</h2>
    <p id="confirm-message"></p>
    <div class="row end">
      <button value="cancel" class="btn" autofocus>Cancel</button>
      <button value="confirm" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </form>
</dialog>
