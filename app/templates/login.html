{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" autocomplete="username" required autofocus value="{{ form.username or '' }}">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <label class="check"><input type="checkbox" name="remember" value="1"> Remember me for 30 days</label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  {% if registration_open %}<p class="muted">No account? <a href="/register">Create one</a>.</p>{% endif %}
</section>
{% endblock %}
