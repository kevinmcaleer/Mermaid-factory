services:
  mermaid-factory:
    build: .
    image: ghcr.io/kevinmcaleer/mermaid-factory:latest
    restart: unless-stopped
    init: true  # reap zombies and forward signals cleanly
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/mermaid.db
      PORT: ${PORT:-8000}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:${PORT:-8000}"
    volumes:
      # The SQLite database lives here on the host: back up ./data (see README).
      - ./data:/data
      - ./backups:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request,sys; sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\",\"8000\")}/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
