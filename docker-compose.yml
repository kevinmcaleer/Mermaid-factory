services:
  mermaid-factory:
    build: .
    image: ghcr.io/kevinmcaleer/mermaid-factory:latest
    restart: unless-stopped
    init: true  # reap zombies and forward signals cleanly
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/mermaid.db
      PORT: ${PORT:-8000}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:${PORT:-8000}"
    volumes:
      # The SQLite database lives here on the host: back up ./data (see README).
      - ./data:/data
      - ./backups:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request,sys; sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\",\"8000\")}/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Cloudflare Tunnel: publishes the app at your hostname (e.g.
  # mermaid.kevspowertools.com) without opening any ports on this machine.
  # Only starts when COMPOSE_PROFILES=tunnel is set in .env (or with
  # `docker compose --profile tunnel up -d`). See "Cloudflare Tunnel" in README.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      mermaid-factory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
